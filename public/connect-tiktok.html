<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok · Disparo Seguro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="/i18n-data.js"></script>
  <script src="/i18n.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#08090d;--card:#11131a;--text:#eef2f8;--muted:#7c8798;--border:#1d222e;--accent:#00f2fe;--accent2:#fe2c55;--danger:#ff4d4f}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:1rem;color:var(--text);background:radial-gradient(760px 440px at 100% -10%,rgba(0,242,254,.15),transparent 60%),radial-gradient(600px 380px at 0% 110%,rgba(254,44,85,.15),transparent 60%),var(--bg)}
    .box{text-align:center;padding:2.4rem 2rem;max-width:440px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 30px 70px -22px rgba(0,0,0,.6)}
    .tt-logo{width:56px;height:56px;border-radius:14px;background:#000;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;box-shadow:0 10px 24px -8px rgba(0,242,254,.5)}
    .tt-logo svg{width:32px;height:32px;fill:#fff}
    h3{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.5rem}
    p{font-size:.875rem;color:var(--muted);line-height:1.55}
    .spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:1.1rem auto 0;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{color:var(--danger);margin-top:1rem;font-size:.85rem;background:rgba(255,77,79,.1);border:1px solid rgba(255,77,79,.3);border-radius:10px;padding:.75rem 1rem;display:none;white-space:pre-line;text-align:left}
    button{margin-top:1.3rem;padding:.75rem 1.6rem;background:linear-gradient(135deg,var(--accent),#00a8ff);color:#000;border:none;border-radius:11px;font-size:.9rem;font-weight:800;cursor:pointer;box-shadow:0 12px 26px -10px rgba(0,242,254,.7);transition:transform .12s,filter .15s}
    button:hover{transform:translateY(-1px);filter:brightness(1.08)}
    button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .promo-foot{margin-top:1.3rem;font-size:.76rem;color:var(--muted);text-align:center}
    .promo-foot a{color:var(--accent);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <div class="box">
    <div class="tt-logo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.89 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.35 0 .68.06 1 .16V9.41a6.34 6.34 0 0 0-1-.08 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.33 6.34 6.34 0 0 0 6.34-6.33V9.06a8.28 8.28 0 0 0 4.76 1.48V7.1a4.84 4.84 0 0 1-1-.41z"/></svg>
    </div>
    <h3 id="title">Conectar TikTok</h3>
    <p id="msg">Clique em Conectar para autorizar sua conta no TikTok oficial.</p>
    <div class="spinner" id="spinner"></div>
    <div class="error" id="err"></div>
    <button id="btn" onclick="startAuth()">Conectar com TikTok</button>
  </div>
  <div class="promo-foot" id="promoFoot">
    <span>Hub Disparo Seguro</span> · <span>Integração Oficial TikTok</span>
  </div>

  <script>
    var AUTH_URL = '{{AUTH_URL}}';
    var LANG     = '{{LANG}}';
    if (window.I18N && LANG) window.I18N.setLang(LANG);
    function T(k, v){ return window.I18N ? window.I18N.t(k, v) : k; }

    (function initStatic(){
      document.title = (T('cpop.tt.title') || 'Conectar TikTok') + ' · Disparo Seguro';
      var elTitle = document.getElementById('title'); if (elTitle) elTitle.textContent = T('cpop.tt.title') || 'Conectar TikTok';
      var elMsg = document.getElementById('msg'); if (elMsg) elMsg.textContent = T('cpop.tt.intro') || 'Autorize sua conta TikTok com o Login Kit oficial.';
      var elBtn = document.getElementById('btn'); if (elBtn) elBtn.textContent = T('cpop.tt.btn') || 'Conectar conta TikTok';
    })();

    function startAuth(){
      var btn = document.getElementById('btn');
      btn.disabled = true;
      document.getElementById('msg').textContent = T('cpop.tt.redirecting') || 'Redirecionando para o TikTok…';
      document.getElementById('spinner').style.display = 'block';
      if(!AUTH_URL){
        document.getElementById('spinner').style.display = 'none';
        var el = document.getElementById('err');
        el.textContent = T('cpop.tt.missingKeys') || 'TikTok Client Key não configurado. Verifique as credenciais no painel.';
        el.style.display = 'block';
        btn.disabled = false;
        return;
      }
      window.location.href = AUTH_URL;
    }
  </script>
</body>
</html>
